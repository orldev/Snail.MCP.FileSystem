name: build and tests

# The shared server CI of Snail.Sdk: the tests, the conformance check and the reference; the native program built for
# each platform it ships to and asked over stdio where it runs. The container image is image.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: orldev/Snail.Sdk/.github/workflows/mcp-ci.yml@v1
    with:
      name: Snail.MCP.FileSystem
      contract-variable: SNAIL_FILESYSTEM_SERVER
